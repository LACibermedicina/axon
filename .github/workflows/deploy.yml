# axon — CI/CD: testes de regressão científica + sincronização das credenciais de IA + deploy via SSH
# Secrets (Settings → Secrets and variables → Actions, ou Environment "production"):
#   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY  — acesso SSH à VPS
#   SERVIDOR_ENV  — bloco .env (linhas CHAVE=valor) com as chaves de IA; e/ou secrets individuais
# Variables: AI_PROVIDERS, GEMINI_MODEL … (opcionais) · DEPLOY_MODE=off desliga o deploy
name: ci-axon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # Actions → ci-axon → Run workflow (reenvia credenciais e redeploy)
  schedule:
    - cron: "23 6 * * *"      # resincroniza as credenciais de IA diariamente

concurrency:
  group: axon-production
  cancel-in-progress: false

env:
  PROJETO_NOME: axon
  SUBDOMINIO: axon.m3d.pro
  APP_DIR: /opt/axon

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: Núcleo biofísico — regressão (α = 1,1266 ± 1e-4; razão = 3,2077 ± 1e-4; semente 42)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Shell scripts (sintaxe)
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Compose (validação)
        run: HTTP_PORT=20180 POSTGRES_PASSWORD=x NEO4J_PASSWORD=x docker compose -f docker-compose.yml config -q

  sync-ai-env:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Enviar credenciais de IA (SERVIDOR_ENV/secrets) ao .env da VPS — nunca imprime valores
        env:
          SERVIDOR_ENV: ${{ secrets.SERVIDOR_ENV }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
        run: bash scripts/ci-sync-ai-env.sh

  deploy:
    needs: [test, sync-ai-env]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_MODE != 'off'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://axon.m3d.pro
    steps:
      - uses: actions/checkout@v4
      - name: Chave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sincronizar código (rsync, preserva .env e data/)
        run: |
          rsync -az --delete --exclude '.git' --exclude '.env' --exclude 'data/' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key" ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.APP_DIR }}/"
      - name: Build e restart
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd ${{ env.APP_DIR }} && bash scripts/deploy.sh ${{ github.sha }}"
      - name: Health check público
        run: |
          for i in $(seq 1 10); do curl -fsS https://${{ env.SUBDOMINIO }}/api/health && exit 0; sleep 6; done
          echo "::warning::Stack ok internamente, mas https://${{ env.SUBDOMINIO }} não responde — verifique DNS/proxy do host."
