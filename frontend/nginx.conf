# axon — nginx interno do container "web" (o TLS fica no proxy do host / Traefik)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 2m;
  # DNS do Docker resolvido a cada requisição: o nginx sobe mesmo sem o serviço opcional "realtime" (perfil collab)
  resolver 127.0.0.11 valid=30s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'self'" always;

  location = /api/portal/admin/upload {
    client_max_body_size 100m;
    proxy_request_buffering off;
    set $api_up http://api:8000;
    proxy_pass $api_up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
  location = /feed.xml { rewrite ^ /api/portal/feed.xml last; }
  location = /podcast.xml { rewrite ^ /api/portal/podcast.xml last; }
  location = /agenda.ics { rewrite ^ /api/portal/calendar.ics last; }
  location ~ ^/admin/?$ { return 301 /admin.html; }
  location /api/ {
    set $api_up http://api:8000;
    proxy_pass $api_up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  location /ws/ {
    set $rt_up http://realtime:8090;
    proxy_pass $rt_up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location = /sobre { return 301 /#novidades; }
  location ~ ^/site/?$ { return 301 /#novidades; }
  location ~ ^/(simulador|app)/?$ { return 301 /simulador.html; }
  location ^~ /img/ { expires 30d; add_header Cache-Control "public"; }
  location = /release.json { add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; expires -1; }
  # JS/CSS: o navegador revalida a cada carga (ETag) e recebe a versão nova logo após o deploy
  location ~* \.(js|css)$ { expires -1; }
  location ~* \.(svg|png|jpg|woff2)$ { expires 7d; add_header Cache-Control "public"; }
}
