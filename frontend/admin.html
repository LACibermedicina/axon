<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>axon · Coordenação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
<style>
.adm{max-width:1280px;margin:0 auto;padding:24px max(3vw,14px) 60px}
.login{max-width:460px;margin:8vh auto;padding:28px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font:700 14px Manrope;color:var(--deep);cursor:pointer;min-height:40px}.tabs button.on{background:var(--deep);color:#fff}
.tabs .n{font:600 11px var(--mono);background:#e8faf5;color:var(--teal);border-radius:999px;padding:1px 7px;margin-left:6px}.tabs button.on .n{background:rgba(255,255,255,.2);color:#fff}
.pane{display:grid;gap:14px}
.ai{padding:20px;display:grid;gap:10px}.ai textarea{font:15px Manrope;padding:12px;border-radius:14px;border:1px solid var(--line);min-height:110px;background:#fbfdfc}
.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{border:1px dashed #9fd9cb;background:#f2fbf8;color:var(--deep);border-radius:999px;padding:6px 12px;font:600 13px Manrope;cursor:pointer}
.prop{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.prop .op{font:700 11px var(--mono);text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#e2f0fd;color:#1b6aa8}.prop .op.create{background:#dcf7ef;color:#0b7a64}.prop .op.delete{background:#fde3e6;color:#b0263a}.prop .op.publish{background:#fff1d1;color:#8a5c06}
.prop dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;margin:8px 0 0;font-size:13.5px}.prop dt{color:var(--mute);font-weight:700}.prop dd{margin:0;white-space:pre-wrap}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.row b{color:var(--deep)}.row .meta{font-size:12.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st-pill{font:700 10.5px var(--mono);text-transform:uppercase;padding:2px 8px;border-radius:999px}.st-pill.publicado{background:#dcf7ef;color:#0b7a64}.st-pill.rascunho{background:#fff1d1;color:#8a5c06}.st-pill.arquivado{background:#eef3f2;color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ed{padding:18px;display:grid;gap:4px}.ed .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed textarea{min-height:120px}
.drop{border:2px dashed #9fd9cb;border-radius:18px;padding:26px;text-align:center;background:#f2fbf8;color:var(--deep);font-weight:700;cursor:pointer}
.drop.over{background:#dcf7ef}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:8px;background:#eef3f2}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--sh2)}
.toast[hidden]{display:none}
@media (max-width:700px){.ed .grid,.prop dl{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="./"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="17" fill="#0c9c80"/><path d="M12 36h8l4-12 6 22 5-16 4 6h13" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>axon · coordenação</a><span class="sp"></span><a class="btn ghost sm" href="./">Ver o site</a><button class="btn ghost sm" id="logout" hidden>Sair</button></header>
<main class="adm" id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/programa.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
