# /etc/nginx/sites-available/axon.m3d.pro — gerado por scripts/setup_vps.sh (HTTP_PORT substituída)
server {
  listen 80;
  server_name axon.m3d.pro;
  location / {
    proxy_pass http://127.0.0.1:__HTTP_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
# certbot --nginx -d axon.m3d.pro acrescenta o bloco 443 e o redirecionamento.
