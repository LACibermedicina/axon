# harmonIA — proxy reverso para harmonia.m3d.pro
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name harmonia.m3d.pro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name harmonia.m3d.pro;

    ssl_certificate     /etc/letsencrypt/live/harmonia.m3d.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harmonia.m3d.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;

    client_max_body_size 200m;   # áudios WAV/FLAC e fotos de partituras
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /ws/ {
        proxy_pass http://realtime:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
